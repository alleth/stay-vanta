# __PORT__ is replaced with Railway's $PORT by entrypoint.sh.
<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html/webroot

    <Directory /var/www/html/webroot>
        AllowOverride All
        Require all granted
    </Directory>

    # Stream logs to the container's stdout/stderr so Railway captures them.
    # The access log is "combined" plus the request's X-Request-Id (set by
    # the app on every response), so even a successful request can be found
    # by the reference a user reports, alongside its [req:<id>] app log lines.
    # The request line is method, path and protocol only (%m %U %H), never the
    # query string: a guest search or match must not put names, emails or
    # phone numbers into infrastructure logs (G5, P6).
    ErrorLog /dev/stderr
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" req:%{X-Request-Id}o" combined_req
    CustomLog /dev/stdout combined_req
</VirtualHost>
