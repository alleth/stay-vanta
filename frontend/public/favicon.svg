<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="StayVanta">
  <title>StayVanta</title>
  <!-- The StayVanta mark: an ink upstroke crossing an amber chevron.
       Geometry is taken verbatim from the design reference; the ink stroke
       swaps to a light tone in a dark tab strip, since near-black would
       otherwise disappear there. -->
  <style>
    .ink { stroke: #111827; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e7e7ea; }
    }
  </style>
  <g transform="translate(32,32) scale(0.9) translate(-32,-32)"
     fill="none" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter">
    <path class="ink" d="M44.85,23.51 L32,10.66 L21.98,20.68 L34.71,33.41" />
    <path stroke="#e9a23c" d="M7.83,29.17 L32,53.34 L56.17,29.17" />
  </g>
</svg>
