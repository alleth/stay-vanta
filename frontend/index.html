<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayVanta — All-in-One Hotel & Resort Management Platform</title>
    <!-- Boot splash for the gap before the JS bundle loads. React replaces
         #root with the identical BrandSplash component while the session
         resolves, so a refresh shows one continuous animation. Keep in sync
         with src/components/BrandSplash.jsx / src/index.css. -->
    <script>
      // Resolve the theme before first paint so a dark-mode user never gets a
      // white flash on the way to the app. Mirrors src/context/ThemeContext.jsx
      // (same storage key, same "stored choice wins, else the OS" rule) — keep
      // the two in sync.
      (function () {
        try {
          var t = localStorage.getItem('stayvanta_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* storage blocked (private mode): light is the default */
        }
      })();
    </script>
    <style>
      /* The splash's own copy of the palette — it paints before the bundle's
         CSS exists, so it can't use the @theme tokens. */
      :root {
        color-scheme: light;
        --sv-boot-bg: #f7f7f8;
        --sv-boot-fg: #1a1a1e;
        --sv-boot-track: #f1f1f3;
        --sv-boot-accent: #d99211;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --sv-boot-bg: #121317;
        --sv-boot-fg: #e7e7ea;
        --sv-boot-track: #22252b;
        --sv-boot-accent: #e9a62c;
      }
      body { margin: 0; background: var(--sv-boot-bg); }
      .sv-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .sv-boot-word {
        font-size: 2.25rem;
        line-height: 2.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--sv-boot-fg);
      }
      .sv-boot-word span {
        display: inline-block;
        animation: sv-wave 1.3s ease-in-out infinite;
      }
      .sv-boot-word .accent { color: var(--sv-boot-accent); }
      .sv-boot-track {
        position: relative;
        width: 10rem;
        height: 0.25rem;
        border-radius: 9999px;
        background: var(--sv-boot-track);
        overflow: hidden;
      }
      .sv-boot-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 33%;
        border-radius: 9999px;
        background: var(--sv-boot-accent);
        animation: sv-bar-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes sv-wave {
        0%, 40%, 100% { transform: translateY(0); }
        20% { transform: translateY(-0.3em); }
      }
      @keyframes sv-bar-slide {
        0% { left: -35%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="sv-boot" role="status" aria-label="Loading StayVanta">
        <div class="sv-boot-word" aria-hidden="true"><span style="animation-delay:0ms">S</span><span style="animation-delay:70ms">t</span><span style="animation-delay:140ms">a</span><span style="animation-delay:210ms">y</span><span class="accent" style="animation-delay:280ms">V</span><span class="accent" style="animation-delay:350ms">a</span><span class="accent" style="animation-delay:420ms">n</span><span class="accent" style="animation-delay:490ms">t</span><span class="accent" style="animation-delay:560ms">a</span></div>
        <div class="sv-boot-track" aria-hidden="true"><div class="sv-boot-bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
